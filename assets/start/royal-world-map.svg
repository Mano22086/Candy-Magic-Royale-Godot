<g font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle">
 <g transform="translate(275 340)"><circle r="31" fill="#fff0a6" stroke="#fff" stroke-width="5"/><circle r="23" fill="#b34db0"/><text y="9" font-size="25" fill="#fff">1</text></g>
 <g transform="translate(615 465)"><circle r="31" fill="#fff0a6" stroke="#fff" stroke-width="5"/><circle r="23" fill="#347fbd"/><text y="9" font-size="25" fill="#fff">2</text></g>
 <g transform="translate(365 665)"><circle r="31" fill="#fff0a6" stroke="#fff" stroke-width="5"/><circle r="23" fill="#b34db0"/><text y="9" font-size="25" fill="#fff">3</text></g>
 <g transform="translate(635 825)"><circle r="31" fill="#fff0a6" stroke="#fff" stroke-width="5"/><circle r="23" fill="#5e55b7"/><text y="9" font-size="25" fill="#fff">4</text></g>
 <g transform="translate(300 950)"><circle r="31" fill="#fff0a6" stroke="#fff" stroke-width="5"/><circle r="23" fill="#7b4b9d"/><text y="9" font-size="25" fill="#fff">5</text></g>
</g>
<g font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff3d3" letter-spacing="2">
 <text x="105" y="175">ENCHANTED GARDEN</text><text x="535" y="330">CRYSTAL FALLS</text><text x="190" y="555">ROYAL CANDY CASTLE</text><text x="560" y="705">STARLIGHT BRIDGE</text><text x="100" y="1080">DRAGON'S SUMMIT</text>
</g>
