<!-- glowing route connecting the five lands -->
<path d="M275 340C420 355 520 365 615 465S500 615 365 665 480 750 635 825 410 910 300 950" fill="none" stroke="#ffe9a5" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 22" filter="url(#glow)"/>
<path d="M275 340C420 355 520 365 615 465S500 615 365 665 480 750 635 825 410 910 300 950" fill="none" stroke="#fff8d6" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 22"/>
