<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Candy Magic Royale — Royal World Map</title>
<desc id="desc">A magical candy kingdom map with five connected lands, a crystal waterfall, enchanted candy forest, royal castle, starlight bridge and dragon summit.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#160d3d"/><stop offset=".55" stop-color="#3c1c70"/><stop offset="1" stop-color="#171044"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#e77bdc" stop-opacity=".48"/><stop offset="1" stop-color="#8b55e9" stop-opacity="0"/></radialGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#72f4ff"/><stop offset="1" stop-color="#3974d8"/></linearGradient>
 <linearGradient id="grass" x2=".15" y2="1"><stop stop-color="#9cf4b4"/><stop offset="1" stop-color="#328e91"/></linearGradient>
 <linearGradient id="pinkland" x2="0" y2="1"><stop stop-color="#ffb3e5"/><stop offset="1" stop-color="#bd58b8"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff2a6"/><stop offset="1" stop-color="#ff9e57"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#c6a4ff"/><stop offset="1" stop-color="#6942b8"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="130" height="130" patternUnits="userSpaceOnUse"><circle cx="18" cy="25" r="2" fill="#fff2c2"/><circle cx="83" cy="61" r="1.5" fill="#d9c5ff"/><path d="M112 13v12m-6-6h12" stroke="#ffe8a5" stroke-width="2" opacity=".7"/></pattern>
</defs>
<rect width="900" height="1120" rx="38" fill="url(#sky)"/>
<ellipse cx="430" cy="280" rx="430" ry="260" fill="url(#nebula)"/>
<rect width="900" height="1120" fill="url(#stars)" opacity=".9"/>
<g fill="#fff2bd" opacity=".9"><path d="M95 160l9 23 23 9-23 9-9 23-9-23-23-9 23-9z"/><path d="M770 220l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/><path d="M700 520l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/></g>
<g opacity=".5" fill="none" stroke="#a78bfa" stroke-width="3"><path d="M0 360Q210 300 420 370T900 330"/><path d="M0 760Q230 690 450 770T900 720"/></g>
