<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1500">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#160638"/><stop offset=".42" stop-color="#35105f"/><stop offset="1" stop-color="#17082f"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#bd55ff" stop-opacity=".55"/><stop offset="1" stop-color="#6b22bd" stop-opacity="0"/></radialGradient>
 <linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#fff5ff"/><stop offset=".25" stop-color="#c98cff"/><stop offset=".65" stop-color="#7c35d7"/><stop offset="1" stop-color="#32105f"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#b6f6ff" stop-opacity=".9"/><stop offset=".45" stop-color="#52cfff" stop-opacity=".65"/><stop offset="1" stop-color="#8b5aff" stop-opacity="0"/></linearGradient>
